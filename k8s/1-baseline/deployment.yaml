# Baseline: the lab's setup, done correctly (indentation fixed) plus readiness/liveness probes.
# 2 replicas, only on nodes labelled role=worker-node. The scheduler usually puts one on each
# worker, but nothing forces it to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      nodeSelector:
        role: worker-node
      containers:
        - name: whoami
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            # Downward API: Kubernetes tells the app who and where it is
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 300Mi
            limits:
              memory: 450Mi
