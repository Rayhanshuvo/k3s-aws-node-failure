# Resilient: built so that losing one worker costs (almost) nothing.
#  - 4 replicas spread over both workers (topologySpreadConstraints), so every
#    node always has local pods for externalTrafficPolicy: Local
#  - pods on an unreachable node are replaced after 30 s instead of the default 300 s
#  - graceful shutdown with preStop for planned moves (drain)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      nodeSelector:
        role: worker-node
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway   # soft: when a worker dies, replacements may still go to the survivor
          labelSelector:
            matchLabels:
              app: whoami
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      terminationGracePeriodSeconds: 40
      containers:
        - name: whoami
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: 200m
              memory: 300Mi
            limits:
              memory: 450Mi
