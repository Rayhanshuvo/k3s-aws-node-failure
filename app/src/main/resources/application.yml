server:
  port: 8080
  # On SIGTERM: stop taking new requests, finish the ones in flight.
  shutdown: graceful

spring:
  application:
    name: whoami-api
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  version: ${APP_VERSION:v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /actuator/health/readiness
      show-details: never
